services:

  # ── AIA Assist Chat UI ───────────────────────────────────────────────────────
  cobalt-chat-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_RAG_API_BASE_URL: ${VITE_RAG_API_BASE_URL:-http://localhost:8083}
        VITE_GRAFANA_BASE_URL: ${VITE_GRAFANA_BASE_URL:-http://localhost:3001}
    container_name: cobalt_chat_ui
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
